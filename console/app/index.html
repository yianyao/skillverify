<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillverify 操作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="brand-name">skillverify 操作台</span>
    <span class="brand-sub">语义评审 · 评测 · 命令组装台</span>
  </div>
  <nav id="domain-tabs"><!-- 域切换（JS 渲染） --></nav>
  <div id="snapshot-banner" title="静态快照：数据为构建时内省结果，skillverify 演进后需重跑 console/build.py 重建">
    <span class="snap-badge">静态快照</span>
    <span id="snap-version"></span>
    <span id="snap-time"></span>
    <button id="cmd-history" type="button" hidden title="查看执行桥审计（console/history.jsonl 尾部 50 条）">🕘 历史</button>
  </div>
</header>

<div id="catalog-banner" hidden title="桥模式实况与入库快照的差异报告（GET /catalog）"></div>

<main id="layout">
  <aside id="canvas">
    <div id="preset-bar"><!-- 套餐一键预填（JS 渲染，域内全部 pipeline 合并） --></div>
    <div id="pipelines"><!-- 流程线块（JS 渲染，域内每条 pipeline 一块） --></div>
    <div id="canvas-note"></div>
  </aside>
  <div id="splitter" title="拖动调整左栏宽度；双击恢复默认宽度">
    <button id="canvas-toggle" type="button" title="收起左栏">⟨</button>
  </div>
  <section id="inspector"><!-- 节点详情（JS 渲染） --></section>
</main>

<footer id="commandbar">
  <div id="run-row" hidden>
    <input id="run-cwd" type="text" placeholder="执行工作目录（留空 = 桥启动目录）">
    <button id="cmd-run" type="button" hidden disabled title="经执行桥在桥端二次校验后执行当前命令">▶ 执行</button>
  </div>
  <div id="cmd-errors"></div>
  <div id="cmd-preview-wrap">
    <code id="cmd-preview"></code>
    <button id="cmd-copy" type="button" title="复制完整命令">复制</button>
  </div>
  <pre id="run-output" hidden></pre>
</footer>

<div id="history-panel" hidden>
  <div class="history-head">
    <span>执行审计（桥端 console/history.jsonl，最新在上）</span>
    <button id="history-close" type="button">关闭</button>
  </div>
  <div id="history-list"></div>
</div>

<div id="toast" hidden></div>
