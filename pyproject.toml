[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillverify"
dynamic = ["version"]
description = "Agent Skill 生命周期验证套件（个人小团队版，宿主无关）"
readme = "验证流程指南.md"
requires-python = ">=3.10"
# 许可证：字段宜简短（本项目自己的 HYG-006），声明了就必须随包有许可文件（HYG-007）——
# 所以仓库根有 LICENSE，且 `[tool.setuptools]` 把它带进 sdist/wheel。
license = { text = "MIT" }
keywords = ["agent", "skill", "validation", "lint", "review"]
dependencies = []          # 纯标准库：不引入任何第三方运行时依赖
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
skillverify = "skillverify.cli:main"

[project.urls]
Homepage = "https://github.com/yianyao/skillverify"
Repository = "https://github.com/yianyao/skillverify"
Issues = "https://github.com/yianyao/skillverify/issues"
Specification = "https://agentskills.io/specification"

[tool.setuptools]
# 显式列出包：避免把 legacy/（归档的旧体系）与 tests/ 打进发布物
packages = ["skillverify", "skillverify.cli", "skillverify.lint"]

[tool.setuptools.dynamic]
# 版本号的唯一真源是 skillverify/__init__.py 的 __version__
# （旧体系把版本只写在文档字符串里，评审时漏掉了——一个看不见的常量等于不存在）
version = { attr = "skillverify.__version__" }

[tool.setuptools.package-data]
# **运行时数据必须随包分发**：hosts.toml（宿主布局声明）与
# review-prompts.json（30 条评审提示词的目录）。漏了这两样，
# `discover`/`check`/`review` 会直接失效——而且在源码目录里跑永远发现不了。
skillverify = ["data/*.toml", "data/*.json"]
