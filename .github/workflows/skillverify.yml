# skillverify —— CI 样例（GitHub Actions）
#
# 为什么需要它：本地 pre-commit hook 只能拦住"你记得装 hook 且没加 --no-verify"的提交；
# 一旦换机器、换人、或有人绕过 hook，门禁就形同虚设。CI 是那条不依赖记性的底线。
#
# 用法：把本文件放到你的技能仓库的 `.github/workflows/` 下（这个仓库自己也可以直接用）。
# 需要改的地方只有两处：`SKILLS_ROOT`（技能放在哪）与是否开启 `--scripts`。
name: skillverify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # 兼容性承诺要有实测：pyproject 写的是 requires-python >=3.10，而此前 CI 只跑过 3.12/3.13。
    # 3.11 是 discover/check/watch/deliver/hook 的实际下限（tomllib 解析 hosts.toml）——
    # 最低也要把 3.11 跑上，否则"支持 3.10+"这句话没有任何证据。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # 技能根：本仓库的技能（evals-skill/）直接放在仓库根，所以这里用 . ；
      # 抄到你的技能仓库时，改成你的技能根（官方跨宿主约定是 .agents/skills）
      SKILLS_ROOT: .
      # 每推必守的阶段：spec+lint（纯机械判定，可离线复核）。
      # evals/review 依赖人工/模型评审产物（评审记录、trigger-runs.json 等），
      # 其「未执行」SKIP 在 --strict 下同样阻断——那是里程碑把关的事：
      # 发版前单独跑一次 `skillverify deliver --stages all --strict --scripts` 即可
      STAGES: both
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # deliver 记录里要写 git 锚点，浅克隆会拿不到 commit

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: python -m pip install -e .

      - name: 机械层（spec+lint）+ 脚本契约实测
        # --scripts 会**真的执行**技能自带脚本（以 --help 与一个非法参数调用）。
        # 技能仓库里开启是合适的；若你的脚本有副作用，去掉这个开关即可（相关规则会记"未覆盖"，
        # --strict 门禁会被拦——那正是提醒你：发行物里的脚本没有契约证据）。
        # check 的退出码 2 = 无 FAIL 但有 WARN/SKIP——按工具哲学 WARN 留给人甄别、不阻断 CI，
        # 客观的 FAIL 由下一步 deliver 门禁兜底（它对 FAIL 才返回 1）。
        run: |
          skillverify check --stages "$STAGES" --scripts \
            --root "$SKILLS_ROOT" --out check.json --json > /dev/null || true
          skillverify check --stages "$STAGES" --scripts --root "$SKILLS_ROOT" || [ $? -eq 2 ]

      - name: 交付门禁（--strict：连"未执行/未覆盖"也阻断）
        run: skillverify deliver --stages "$STAGES" --strict --scripts --root "$SKILLS_ROOT"

      - name: 上传报告（无论成败都留痕）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillverify-report-${{ matrix.python-version }}
          path: |
            check.json
            .agents/skillverify/deliver/latest.json
            .agents/skillverify/deliver/latest.md

  # 只在开发**这个工具本身**时需要：跑 14 个回归套件（默认 13）
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 回归套件的测试夹具用了 3.13 的 Path.read_text/write_text(newline=)
          # （生产代码已改用 open() 保持 3.10+ 兼容；夹具属开发环境资产，对齐本地开发版本）
          python-version: "3.13"
      # hashFiles 只能在 step 级 if 中使用（作业级条件在 checkout 前求值，无工作区可哈希），
      # 所以这里先探测文件、再按 step 输出决定是否跑回归
      - name: 检测是否存在回归套件
        id: has_tests
        run: echo "ok=$(test -f tests/run_all.py && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has_tests.outputs.ok == 'true'
        run: python -m tests.run_all

  # 验证仓库根那份 composite Action（`action.yml`）真的能用。
  # 为什么需要：本地没有 YAML 解析器（标准库不含），所以 `action.yml` 的**语法**
  # 只有在这里才会被验证一次；顺带验证 composite 步骤、inputs 传递与退出码语义。
  # `strict: "false"` 是刻意的：本仓库自身存在 WARN/「未执行」项，不该因此把这个 job 打红
  # ——这本身就是"退出码 2 不等于失败"的一次实测。
  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          skills-root: "."
          stages: both
          scripts: "false"
          strict: "false"
          # 刻意用 true：`upload-record` 这条分支要真跑过一次，否则它是"写了但从没执行"的代码
          upload-record: "true"

  # 验证 `fail-on-warn` 真的起作用——**A/B 一对，缺一不可**。
  # 为什么必须成对：若夹具里有 FAIL，那么无论 fail-on-warn 是 true 还是 false 都会失败，
  # 断言"它失败了"就是**恒真**的假断言。所以 A 步（fail-on-warn=false）必须真的成功，
  # 用来证明"夹具只有 WARN、没有 FAIL"；B 步才断言失败。
  # 夹具本地实测过：只跑 lint 阶段 → result=pass、FAIL=0、WARN=1（HYG-007 声明了 license
  # 却没有随包许可文件）。**必须无 BOM**：带 BOM 会额外触发 ENC-003，测试就变成在量 BOM。
  action-selftest-warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 造 WARN 夹具（无 BOM 的 UTF-8）
        run: |
          mkdir -p /tmp/warn-root/warn-skill
          printf -- '---\nname: warn-skill\ndescription: 夹具：声明了 license 但没有随包许可文件。\nlicense: MIT\n---\n\n# W\n' \
            > /tmp/warn-root/warn-skill/SKILL.md
      # A 步：不加 continue-on-error——它必须真的通过，否则说明夹具含 FAIL、后面那条断言无意义
      - id: a
        uses: ./
        with:
          skills-root: /tmp/warn-root
          stages: lint
          scripts: "false"
          strict: "false"
          fail-on-warn: "false"
          upload-record: "false"
      # B 步：必须接住失败，才能拿到 outcome 再断言
      - id: b
        continue-on-error: true
        uses: ./
        with:
          skills-root: /tmp/warn-root
          stages: lint
          scripts: "false"
          strict: "false"
          fail-on-warn: "true"
          upload-record: "false"
      - name: 断言 fail-on-warn=true 时门禁真的失败
        if: steps.b.outcome != 'failure'
        run: |
          echo "::error::fail-on-warn=true 时该失败却没失败（outcome=${{ steps.b.outcome }}）"
          exit 1

  # 验证 Action 的**豁免通道**（`accept` + `because`）透传真的起作用——同样是 A/B 一对：
  # A 步同夹具**不带**豁免 ⇒ 必须失败；B 步同夹具**带**豁免 ⇒ 必须通过。
  # 只差这两个输入，所以"豁免把阻断项变成已豁免"这件事被真正隔离出来验证了。
  # 夹具：写一个未知 frontmatter 字段（`version:`）→ SKILL-004 记 FAIL（只跑 spec 阶段）。
  action-selftest-accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 造 FAIL 夹具（无 BOM 的 UTF-8）
        run: |
          mkdir -p /tmp/fail-root/fail-skill
          printf -- '---\nname: fail-skill\ndescription: 夹具：刻意写未知字段 version，触发 SKILL-004 FAIL。\nversion: "1.0"\n---\n\n# F\n' \
            > /tmp/fail-root/fail-skill/SKILL.md
      # A：不带豁免 —— 有 FAIL 就必须失败
      - id: a
        continue-on-error: true
        uses: ./
        with:
          skills-root: /tmp/fail-root
          stages: spec
          strict: "false"
          upload-record: "false"
      - name: 断言有 FAIL 时门禁失败
        if: steps.a.outcome != 'failure'
        run: |
          echo "::error::夹具含 FAIL 但门禁没失败（outcome=${{ steps.a.outcome }}）——夹具或门禁有问题"
          exit 1
      # B：同一夹具 + 豁免（accept 必须与 because 成对）—— 必须真的通过，否则这个 job 自己会红
      - uses: ./
        with:
          skills-root: /tmp/fail-root
          stages: spec
          strict: "false"
          accept: "SKILL-004"
          because: "夹具：故意用未知字段，用来验证 Action 的豁免透传（本地/CI 都只对这份夹具生效）"
          upload-record: "false"
